title: KH1 Auto Save (2.0.0)
originalAuthor: Denhonator
description: >-
  Autosaves on every room load into save slot 99, so it shows up in the Load menu as a normal
  save. Also keeps a side copy of the last two snapshots, restorable in place with
  L1+L2+R1+R2+D-pad Right (or Down for the older one). LuaBackend script, requires Denhonator's
  io_packages address files.
game: kh1
assets:
- name: scripts/1fmAutosave.lua
  platform: pc
  method: copy
  source:
  - name: 1fmAutosave.lua
